name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check ruff==0.16.4 coverage==7.16.0
      # The touchscreen sweep needs a display server; without one it skips.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth fonts-dejavu-core
      - run: ruff check src tests scripts main.py
      - name: Offline tests with coverage
        env:
          PYTHONPATH: src
          FLOORTERMINAL_DISABLE_UPDATE_NETWORK: "1"
          FLOORTERMINAL_DISABLE_NETWORK: "1"
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24 -dpi 96 -nolisten tcp" python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine
          python -m coverage report
          python -m coverage report --fail-under=70
      - name: Verify public source and signed release channel
        run: python scripts/release/verify_publication.py
      - run: python -m compileall -q src scripts tests main.py
      # The supervised launcher and installer are deployment-critical shell.
      - run: sh -n packaging/linux/floorterminal-launch
      - run: bash -n packaging/linux/install.sh scripts/install/prepare_release_on_pi.sh
