version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    groups:
      python-tooling:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
# Security updates remain separate and are not delayed by the weekly version schedule.
