name: Feature request
description: Propose a provider-neutral line-reporting improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired user outcome
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety, security, privacy, and compatibility considerations
    validations:
      required: true
