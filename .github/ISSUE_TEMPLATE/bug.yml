name: Bug report
description: Report a reproducible application defect without sensitive data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, production URLs, employee data, or facility identifiers. Report security issues privately under SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version and commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Raspberry Pi OS ARM64, Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I reproduced this outside production machinery and removed sensitive data.
          required: true
