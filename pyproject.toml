[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floorterminal"
version = "1.0.0"
description = "Provider-neutral line-side reporting and first-response touchscreen console"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
keywords = ["downtime", "manufacturing", "maintenance", "raspberry-pi", "tkinter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["ruff==0.16.4"]

[project.scripts]
floorterminal = "floorterminal.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["floorterminal*"]

[tool.setuptools.package-data]
"floorterminal.i18n" = ["*.json"]
"floorterminal.assets.sounds" = ["*.wav", "README.md"]
"floorterminal.assets.branding" = ["*.png"]

[tool.unittest]
start-directory = "tests"

[tool.coverage.run]
source = ["src"]
# The touchscreen sweep runs in a subprocess, so its measurement must be merged.
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
show_missing = false
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The GUI controller and top-level release builder deliberately catch at their
# process/thread boundaries so failures become operator-visible audit events.
"src/floorterminal/app.py" = ["BLE001"]
"src/floorterminal/controller/workflow.py" = ["BLE001"]
"src/floorterminal/controller/updates.py" = ["BLE001"]
"scripts/build/build.py" = ["BLE001"]
# Collecting every fault from every screen is the purpose of the smoke driver.
"tests/unit/ui_smoke_driver.py" = ["BLE001"]
